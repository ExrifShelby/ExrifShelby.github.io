function playSound(type){
  if(audioCtx.state==='suspended')audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if(type=='shoot'){osc.type='square';osc.frequency.value=1000;gain.gain.setValueAtTime(0.5,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.07);}
  if(type=='hit'){osc.type='sine';osc.frequency.value=100;gain.gain.setValueAtTime(0.6,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);}

}
