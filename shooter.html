<!DOCTYPE html>
<html>
<head>
<title>RC.COODING 3D</title>
<style>body{margin:0;background:black;overflow:hidden;color:white;font-family:sans-serif}</style>
</head>
<body>
<div style="position:absolute;top:10px;left:10px">RC.COODING V1.3 - 3D</div>
<script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const cube = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshBasicMaterial({color:0x00ff00}));
scene.add(cube); camera.position.z = 3;
function animate(){requestAnimationFrame(animate); cube.rotation.x+=0.01; cube.rotation.y+=0.01; renderer.render(scene,camera)}
animate();
</script>
</body>
</html>
